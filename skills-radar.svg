<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320">
<defs>
  <linearGradient id="rbg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0a0e1a"/>
    <stop offset="100%" stop-color="#122033"/>
  </linearGradient>
  <linearGradient id="fillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0ea5e9" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#14b8a6" stop-opacity=".35"/>
  </linearGradient>
  <clipPath id="cardClip"><rect x="0" y="0" width="480" height="320" rx="18"/></clipPath>
  <style>
    .title{ font-family:'Segoe UI',sans-serif; font-size:17px; font-weight:700; fill:#e2e8f0; }
    .axisLbl{ font-family:'Segoe UI',sans-serif; font-size:12px; fill:#94a3b8; }
    @keyframes growPoly{ from{ opacity:0; } to{ opacity:1; } }
    .poly{ animation:growPoly 1.1s cubic-bezier(.2,.8,.2,1) forwards; transform-origin:240px 172px; }
    @keyframes dotIn{ from{ opacity:0; transform:scale(0);} to{ opacity:1; transform:scale(1);} }
    .dot{ opacity:0; animation:dotIn .4s ease-out forwards; transform-box:fill-box; transform-origin:center; }
    @keyframes fadeIn3{ from{opacity:0;} to{opacity:1;} }
    .fadeIn3{ opacity:0; animation:fadeIn3 .6s ease-out forwards; }
  </style>
</defs>
<g clip-path="url(#cardClip)">
  <rect width="480" height="320" fill="url(#rbg)"/>
  <rect width="480" height="320" fill="none" stroke="#1e3a52" stroke-width="1.5"/>
  <text x="24" y="34" class="title">&#128202; Skill Radar</text>

  <polygon points="240.0,142.5 265.5,157.2 265.5,186.8 240.0,201.5 214.5,186.8 214.5,157.3" fill="none" stroke="#1e3a52" stroke-width="1"/><polygon points="240.0,113.0 291.1,142.5 291.1,201.5 240.0,231.0 188.9,201.5 188.9,142.5" fill="none" stroke="#1e3a52" stroke-width="1"/><polygon points="240.0,83.5 316.6,127.8 316.6,216.2 240.0,260.5 163.4,216.3 163.4,127.8" fill="none" stroke="#1e3a52" stroke-width="1"/><polygon points="240.0,54.0 342.2,113.0 342.2,231.0 240.0,290.0 137.8,231.0 137.8,113.0" fill="none" stroke="#1e3a52" stroke-width="1"/>
  <line x1="240" y1="172" x2="240.0" y2="54.0" stroke="#1e3a52" stroke-width="1"/><line x1="240" y1="172" x2="342.2" y2="113.0" stroke="#1e3a52" stroke-width="1"/><line x1="240" y1="172" x2="342.2" y2="231.0" stroke="#1e3a52" stroke-width="1"/><line x1="240" y1="172" x2="240.0" y2="290.0" stroke="#1e3a52" stroke-width="1"/><line x1="240" y1="172" x2="137.8" y2="231.0" stroke="#1e3a52" stroke-width="1"/><line x1="240" y1="172" x2="137.8" y2="113.0" stroke="#1e3a52" stroke-width="1"/>

  <polygon class="poly" points="240.0,80.0 326.9,121.8 313.6,214.5 240.0,275.8 163.4,216.3 176.6,135.4" fill="url(#fillGrad)" stroke="#0ea5e9" stroke-width="2.5">
    <animate attributeName="points"
      values="240,172 240,172 240,172 240,172 240,172 240,172;240.0,80.0 326.9,121.8 313.6,214.5 240.0,275.8 163.4,216.3 176.6,135.4"
      dur="1.1s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </polygon>

  <circle cx="240.0" cy="80.0" r="4" fill="#0ea5e9" class="dot" style="animation-delay:1.1s"/><circle cx="326.9" cy="121.8" r="4" fill="#0ea5e9" class="dot" style="animation-delay:1.1800000000000002s"/><circle cx="313.6" cy="214.5" r="4" fill="#0ea5e9" class="dot" style="animation-delay:1.26s"/><circle cx="240.0" cy="275.8" r="4" fill="#0ea5e9" class="dot" style="animation-delay:1.34s"/><circle cx="163.4" cy="216.3" r="4" fill="#0ea5e9" class="dot" style="animation-delay:1.4200000000000002s"/><circle cx="176.6" cy="135.4" r="4" fill="#0ea5e9" class="dot" style="animation-delay:1.5s"/>
  <g class="fadeIn3" style="animation-delay:.2s"><text x="240.0" y="28.0" text-anchor="middle" class="axisLbl">Frontend</text><text x="364.7" y="100.0" text-anchor="start" class="axisLbl">Backend</text><text x="364.7" y="244.0" text-anchor="start" class="axisLbl">AI / ML</text><text x="240.0" y="316.0" text-anchor="middle" class="axisLbl">DSA</text><text x="115.3" y="244.0" text-anchor="end" class="axisLbl">Databases</text><text x="115.3" y="100.0" text-anchor="end" class="axisLbl">DevOps</text></g>
</g>
</svg>
