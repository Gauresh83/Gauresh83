<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="160" viewBox="0 0 1280 160">
<defs>
  <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0a0e1a"/>
    <stop offset="50%" stop-color="#0f1b2e"/>
    <stop offset="100%" stop-color="#122033"/>
  </linearGradient>
  <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#0ea5e9" stop-opacity=".35"/>
    <stop offset="100%" stop-color="#14b8a6" stop-opacity=".35"/>
  </linearGradient>
  <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#14b8a6" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#0ea5e9" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7dd3fc"/>
    <stop offset="50%" stop-color="#5eead4"/>
    <stop offset="100%" stop-color="#7dd3fc"/>
    <animate attributeName="x1" values="-20%;120%;-20%" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="80%;220%;80%" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <clipPath id="footClip"><rect x="0" y="0" width="1280" height="160" rx="24"/></clipPath>
  <style>
    .sign{ font-family:'Brush Script MT','Segoe Script',cursive; font-size:34px; font-weight:700; fill:url(#textGrad); }
    .sub{ font-family:'Fira Code',monospace; font-size:13px; fill:#94a3b8; }
    @keyframes waveScroll1{ from{ transform:translateX(0); } to{ transform:translateX(-1280px); } }
    @keyframes waveScroll2{ from{ transform:translateX(0); } to{ transform:translateX(-1280px); } }
    .waveRow1{ animation:waveScroll1 9s linear infinite; }
    .waveRow2{ animation:waveScroll2 6s linear infinite reverse; }
    @keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
    .fadeUp{ opacity:0; animation:fadeUp .8s ease-out forwards; }
    @keyframes twinkle{ 0%,100%{opacity:.3;} 50%{opacity:1;} }
    .star{ animation:twinkle 2.6s ease-in-out infinite; }
  </style>
</defs>
<g clip-path="url(#footClip)">
  <rect width="1280" height="160" fill="url(#fbg)"/>

  <g fill="#dff2ff">
    <circle class="star" cx="90" cy="30" r="1.6" style="animation-delay:.2s"/>
    <circle class="star" cx="220" cy="18" r="1.3" style="animation-delay:1.1s"/>
    <circle class="star" cx="1040" cy="24" r="1.6" style="animation-delay:.6s"/>
    <circle class="star" cx="1180" cy="40" r="1.3" style="animation-delay:1.6s"/>
    <circle class="star" cx="640" cy="16" r="1.4" style="animation-delay:.9s"/>
  </g>

  <g class="fadeUp" style="animation-delay:.15s">
    <text x="640.0" y="66" text-anchor="middle" class="sign">Thanks for stopping by</text>
    <text x="640.0" y="92" text-anchor="middle" class="sub">&#183; keep coding &#183; keep growing &#183; @Gauresh83 &#183;</text>
  </g>

  <g transform="translate(0,108)">
   <g class="waveRow2">
    <path d="M0,20 C 160,-10 320,50 480,20 C 640,-10 800,50 960,20 C 1120,-10 1280,50 1440,20 L 1440,60 L 0,60 Z" fill="url(#waveGrad1)"/>
    <path d="M0,20 C 160,-10 320,50 480,20 C 640,-10 800,50 960,20 C 1120,-10 1280,50 1440,20 L 1440,60 L 0,60 Z" fill="url(#waveGrad1)" transform="translate(1280,0)"/>
   </g>
  </g>
  <g transform="translate(0,122)">
   <g class="waveRow1">
    <path d="M0,26 C 140,0 300,50 460,26 C 620,2 780,50 940,26 C 1100,2 1260,50 1420,26 L 1420,70 L 0,70 Z" fill="url(#waveGrad2)"/>
    <path d="M0,26 C 140,0 300,50 460,26 C 620,2 780,50 940,26 C 1100,2 1260,50 1420,26 L 1420,70 L 0,70 Z" fill="url(#waveGrad2)" transform="translate(1280,0)"/>
   </g>
  </g>
</g>
</svg>
