<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200">
<defs>
  <linearGradient id="lbg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#160821"/>
    <stop offset="100%" stop-color="#341246"/>
  </linearGradient>
  <clipPath id="cardClip"><rect x="0" y="0" width="480" height="200" rx="18"/></clipPath>
  <style>
    .title{ font-family:'Segoe UI',sans-serif; font-size:17px; font-weight:700; fill:#ffffff; }
    .lname{ font-family:'Fira Code',monospace; font-size:12.5px; fill:#e2d6f5; }
    .lpct{ font-family:'Fira Code',monospace; font-size:12.5px; fill:#cbb8e6; }
    @keyframes rowIn{ from{ opacity:0; transform:translateX(-8px);} to{ opacity:1; transform:translateX(0);} }
    .row{ opacity:0; animation:rowIn .5s ease-out forwards; }
    @keyframes barIn{ from{ transform:scaleX(0);} to{ transform:scaleX(1);} }
    .bar{ transform-box:fill-box; transform-origin:left; animation:barIn 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
  </style>
</defs>
<g clip-path="url(#cardClip)">
  <rect width="480" height="200" fill="url(#lbg)"/>
  <rect width="480" height="200" fill="none" stroke="#4a2a66" stroke-width="1.5"/>
  <text x="24" y="34" class="title">Most Used Languages</text>

  <g transform="translate(24,54)">
    <g transform="translate(0,0)"><g class="row" style="animation-delay:.1s">
      <text class="lname" y="12">C++</text><text class="lpct" x="420" y="12" text-anchor="end">34.8%</text>
      <rect y="18" width="420" height="7" rx="3.5" fill="#ffffff" opacity=".08"/>
      <rect class="bar" y="18" width="146" height="7" rx="3.5" fill="#f34b7d" style="animation-delay:.3s"/>
    </g></g>
    <g transform="translate(0,32)"><g class="row" style="animation-delay:.25s">
      <text class="lname" y="12">Python</text><text class="lpct" x="420" y="12" text-anchor="end">27.1%</text>
      <rect y="18" width="420" height="7" rx="3.5" fill="#ffffff" opacity=".08"/>
      <rect class="bar" y="18" width="114" height="7" rx="3.5" fill="#3572A5" style="animation-delay:.45s"/>
    </g></g>
    <g transform="translate(0,64)"><g class="row" style="animation-delay:.4s">
      <text class="lname" y="12">JavaScript</text><text class="lpct" x="420" y="12" text-anchor="end">19.6%</text>
      <rect y="18" width="420" height="7" rx="3.5" fill="#ffffff" opacity=".08"/>
      <rect class="bar" y="18" width="82" height="7" rx="3.5" fill="#f1e05a" style="animation-delay:.6s"/>
    </g></g>
    <g transform="translate(0,96)"><g class="row" style="animation-delay:.55s">
      <text class="lname" y="12">HTML/CSS</text><text class="lpct" x="420" y="12" text-anchor="end">12.4%</text>
      <rect y="18" width="420" height="7" rx="3.5" fill="#ffffff" opacity=".08"/>
      <rect class="bar" y="18" width="52" height="7" rx="3.5" fill="#e34c26" style="animation-delay:.75s"/>
    </g></g>
    <g transform="translate(0,128)"><g class="row" style="animation-delay:.7s">
      <text class="lname" y="12">SQL</text><text class="lpct" x="420" y="12" text-anchor="end">6.1%</text>
      <rect y="18" width="420" height="7" rx="3.5" fill="#ffffff" opacity=".08"/>
      <rect class="bar" y="18" width="26" height="7" rx="3.5" fill="#7ad9ff" style="animation-delay:.9s"/>
    </g></g>
  </g>
</g>
</svg>
