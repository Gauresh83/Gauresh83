<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200">
<defs>
  <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#160821"/>
    <stop offset="100%" stop-color="#341246"/>
  </linearGradient>
  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7ad9ff"/>
    <stop offset="100%" stop-color="#ff7ad9"/>
  </linearGradient>
  <clipPath id="cardClip"><rect x="0" y="0" width="480" height="200" rx="18"/></clipPath>
  <style>
    .title{ font-family:'Segoe UI',sans-serif; font-size:17px; font-weight:700; fill:#ffffff; }
    .label{ font-family:'Fira Code',monospace; font-size:12.5px; fill:#cbb8e6; }
    .val{ font-family:'Fira Code',monospace; font-size:12.5px; fill:#8ff0d6; font-weight:700; }
    .ringtxt{ font-family:'Fira Code',monospace; font-size:20px; font-weight:800; fill:#fff; }
    .ringsub{ font-family:'Segoe UI',sans-serif; font-size:9.5px; fill:#cbb8e6; }
    @keyframes rowIn{ from{ opacity:0; transform:translateX(-8px);} to{ opacity:1; transform:translateX(0);} }
    .row{ opacity:0; animation:rowIn .5s ease-out forwards; }
    @keyframes ringSpin{ from{ stroke-dashoffset:339;} }
    .ringfg{ animation:ringSpin 1.8s ease-out forwards; }
    @keyframes softGlow{ 0%,100%{ opacity:.5;} 50%{ opacity:1;} }
    .glow{ animation:softGlow 3s ease-in-out infinite; }
  </style>
</defs>
<g clip-path="url(#cardClip)">
  <rect width="480" height="200" fill="url(#sbg)"/>
  <rect width="480" height="200" fill="none" stroke="#4a2a66" stroke-width="1.5"/>
  <text x="24" y="34" class="title">Gauresh's GitHub Stats</text>

  <g transform="translate(24,55)">
    <g class="row" style="animation-delay:.15s"><text class="label" y="14">&#11088; Total Stars Earned</text><text class="val" x="230" y="14" text-anchor="end">128</text></g>
    <g class="row" style="animation-delay:.30s"><text class="label" y="42">&#128218; Total Commits (2026)</text><text class="val" x="230" y="42" text-anchor="end">614</text></g>
    <g class="row" style="animation-delay:.45s"><text class="label" y="70">&#128257; Total PRs</text><text class="val" x="230" y="70" text-anchor="end">37</text></g>
    <g class="row" style="animation-delay:.60s"><text class="label" y="98">&#9888; Total Issues</text><text class="val" x="230" y="98" text-anchor="end">19</text></g>
    <g class="row" style="animation-delay:.75s"><text class="label" y="126">&#127942; Contributed to</text><text class="val" x="230" y="126" text-anchor="end">9 repos</text></g>
  </g>

  <g transform="translate(370,120)">
    <circle r="64" fill="none" stroke="#2a1740" stroke-width="10"/>
    <circle class="ringfg glow" r="54" fill="none" stroke="url(#ringGrad)" stroke-width="10"
      stroke-dasharray="339" stroke-dashoffset="339" transform="rotate(-90)"
      stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="339" to="72" dur="1.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    </circle>
    <text class="ringtxt" text-anchor="middle" y="2">A+</text>
    <text class="ringsub" text-anchor="middle" y="20">RANK</text>
  </g>
</g>
</svg>
