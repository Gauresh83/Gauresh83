<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200" viewBox="0 0 480 200">
<defs>
  <linearGradient id="sbg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0a0e1a"/>
    <stop offset="100%" stop-color="#122033"/>
  </linearGradient>
  <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#0ea5e9"/>
    <stop offset="55%" stop-color="#14b8a6"/>
    <stop offset="100%" stop-color="#f59e0b"/>
  </linearGradient>
  <clipPath id="cardClip"><rect x="0" y="0" width="480" height="200" rx="18"/></clipPath>
  <style>
    .title{ font-family:'Segoe UI',sans-serif; font-size:17px; font-weight:700; fill:#e2e8f0; }
    .num{ font-family:'Fira Code',monospace; font-size:30px; font-weight:800; fill:#7dd3fc; }
    .lbl{ font-family:'Segoe UI',sans-serif; font-size:11.5px; fill:#94a3b8; }
    .divider{ stroke:#1e3a52; stroke-width:1; }
    @keyframes flicker2{
      0%,100%{ transform:scale(1) translateY(0); opacity:1; }
      25%{ transform:scale(1.05) translateY(-1px); opacity:.92; }
      50%{ transform:scale(.97) translateY(1px); opacity:1; }
      75%{ transform:scale(1.03) translateY(-.5px); opacity:.95; }
    }
    .flame{ animation:flicker2 1.6s ease-in-out infinite; transform-origin:240px 60px; }
    @keyframes countUp{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }
    .stat{ opacity:0; animation:countUp .6s ease-out forwards; }
    @keyframes glowPulse2{ 0%,100%{ filter:drop-shadow(0 0 3px #0ea5e9);} 50%{ filter:drop-shadow(0 0 9px #14b8a6);} }
    .glow{ animation:glowPulse2 2.4s ease-in-out infinite; }
  </style>
</defs>
<g clip-path="url(#cardClip)">
  <rect width="480" height="200" fill="url(#sbg)"/>
  <rect width="480" height="200" fill="none" stroke="#1e3a52" stroke-width="1.5"/>
  <text x="24" y="34" class="title">&#128293; Coding Streak</text>

  <!-- flame icon -->
  <g class="flame glow">
    <path d="M240 30 C 228 46, 222 58, 230 70 C 224 66, 222 58, 224 52 C 218 62, 220 76, 232 82 C 244 88, 258 80, 258 66 C 258 56, 252 50, 248 44 C 250 50, 248 54, 244 56 C 246 46, 244 36, 240 30 Z"
      fill="url(#flameGrad)"/>
  </g>

  <g transform="translate(0,108)">
    <line x1="150" y1="-30" x2="150" y2="70" class="divider"/>
    <line x1="325" y1="-30" x2="325" y2="70" class="divider"/>

    <g class="stat" style="animation-delay:.3s">
      <text x="75" y="10" text-anchor="middle" class="num">47</text>
      <text x="75" y="32" text-anchor="middle" class="lbl">CURRENT STREAK</text>
    </g>
    <g class="stat" style="animation-delay:.5s">
      <text x="237" y="10" text-anchor="middle" class="num">73</text>
      <text x="237" y="32" text-anchor="middle" class="lbl">LONGEST STREAK</text>
    </g>
    <g class="stat" style="animation-delay:.7s">
      <text x="402" y="10" text-anchor="middle" class="num">1.2k</text>
      <text x="402" y="32" text-anchor="middle" class="lbl">TOTAL CONTRIBUTIONS</text>
    </g>
  </g>

  <rect x="24" y="176" width="432" height="6" rx="3" fill="#ffffff" opacity=".08"/>
  <rect x="24" y="176" width="330" height="6" rx="3" fill="#14b8a6" class="stat" style="animation-delay:.9s"/>
</g>
</svg>
